name: Release

# Push a tag like v0.1.0: the tree, the commits since the previous tag and the tag
# itself are scanned and the tests run (read-only token); then a draft GitHub
# Release is created (the only step with a write token) with that version's CHANGELOG section and a source archive.
# Publish the draft by hand once the version runs on a real server.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: scripts/scan-private.sh --self-test
      - name: No private patterns in the tree, the commits since the last tag and the tag
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: "1"
          TAG: ${{ github.ref_name }}
        run: |
          scripts/scan-private.sh --length
          scripts/scan-private.sh
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          scripts/scan-private.sh --history "${prev:+$prev..}$TAG" "$TAG"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt && ruff check . && pytest -q

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          git archive --format=tar.gz --prefix="agent-console-$VERSION/" -o "agent-console-$VERSION.tar.gz" "$TAG"
          gh release create "$TAG" "agent-console-$VERSION.tar.gz" --draft --verify-tag \
            --title "agent-console $VERSION" --notes-file notes.md
